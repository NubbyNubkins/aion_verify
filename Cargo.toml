[package]
name = "aion_verify"
version = "3.9.0"
edition = "2021"
rust-version = "1.81"
license = "MPL-2.0"
description = "First-party proof engine, no_std, no unsafe, no external solver. TIER 4 enumerates: it checks a predicate against EVERY input in a bounded/enumerable domain, returning Proven{cases} or Refuted with the counterexample -- complete coverage, not a sample. Combinators: for_all, for_all_where, for_all_u8, for_all_in, for_all_pairs. TIER 5 proves properties over UNBOUNDED integer domains -- all 2^64 values of u64, any number of variables -- WITHOUT enumerating them, by interval abstract interpretation, via an Expr/Prop DSL and prove_contract for pre/postcondition contracts. Tier 5 is SOUND BUT INCOMPLETE: transfer functions over-approximate, so it answers Proven, Refuted with a concrete counterexample, or UNKNOWN when the abstraction is too imprecise (typically relational properties) -- never a false Proven or Refuted. An SMT-based checker such as Kani/CBMC decides cases this returns Unknown on, so Kani remains a stronger independent second opinion rather than being replaced."
keywords = ["verification", "proof", "property-testing", "no-std", "testing"]
categories = ["development-tools::testing", "no-std", "algorithms"]

[features]
# no_std by default -- unchanged. The `std` feature adds the `safety` module, which catches panics
# (index-out-of-bounds, overflow, unwrap, division by zero) automatically. Needs std for catch_unwind.
# It also adds `harvest`, which needs std::fs.
default = []
std = []

[dependencies]

# The engine's most interesting claim is that it proves ANOTHER crate's invariants, not its own -- and
# for three years' worth of releases that claim shipped with no test a downloader could run, because
# the only subject was a private crate reached by PATH and `cargo publish` strips path-only
# dev-dependencies. `aion_verify_subject` is that subject, published so `tests/connection.rs` and
# `tests/grouping.rs` resolve for everybody.
#
# BOTH `version` and `path` are given on purpose. `path` is what a local checkout of the two repos
# side by side builds against; `version` is what `cargo publish` keeps after stripping the path, so
# the shipped crate depends on a real registry release. Publish `aion_verify_subject` FIRST -- a
# publish of this crate against an unpublished dependency is rejected.
[dev-dependencies]
aion_verify_subject = { version = "1.0.0", path = "../aion_verify_subject" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
